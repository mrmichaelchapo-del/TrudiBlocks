<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrudiBlocks - Project</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      background: #f5f5ff;
    }
    textarea {
      width: 100%;
      height: 60px;
      font-size: 16px;
      padding: 8px;
    }
    .label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }
    .url-box {
      margin-top: 16px;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: monospace;
    }

    .stats-buttons button {
      margin-right: 8px;
      padding: 6px 12px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1 id="pageHeading">TrudiBlocks – Project</h1>

  <label class="label" for="projectNameBox">Project name (type here):</label>
  <textarea id="projectNameBox">Project</textarea>

  <div class="url-box">
    Current project URL:<br>
    <span id="projectUrl">https://trudiblocks.com/projects/project</span>
  </div>

  <script>
    const textarea = document.getElementById("projectNameBox");
    const heading = document.getElementById("pageHeading");
    const urlSpan = document.getElementById("projectUrl");

    const baseUrl = "https://trudiblocks.com/projects/";

    function slugify(name) {
      return name
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function updateProjectStuff() {
      let rawName = textarea.value.trim() || "Project";
      const slug = slugify(rawName) || "project";

      document.title = `TrudiBlocks - ${rawName}`;
      heading.innerText = `TrudiBlocks – ${rawName}`;

      const fullUrl = baseUrl + slug;
      urlSpan.innerText = fullUrl;

      history.replaceState(null, "", "/projects/" + slug);
    }

    updateProjectStuff();
    textarea.addEventListener("input", updateProjectStuff);
  </script>

  <div class="stats-buttons">
    <button>♥️ 0</button>
    <button>⭐ 0</button>
    <button>👁️ 0</button>
    <button id="spiralBtn">🌀 0</button>
  </div>

  <button id="remixBtn" style="background: blue;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;">
    <img src="remix.png" alt="Remix icon">
    Remix
  </button>

<script>
  // NORMAL STAT BUTTONS (except spiral)
  const statButtons = document.querySelectorAll(".stats-buttons button");
  const spiralBtn = document.getElementById("spiralBtn");

  statButtons.forEach(btn => {
    if (btn !== spiralBtn) {
      btn.addEventListener("click", () => {
        let [emoji, count] = btn.textContent.split(" ");
        count = parseInt(count) + 1;
        btn.textContent = `${emoji} ${count}`;
      });
    }
  });

  // DISABLE DIRECT CLICKING ON SPIRAL
  spiralBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
  });

  // REMIX BUTTON INCREASES SPIRAL
  const remixBtn = document.getElementById("remixBtn");

  remixBtn.addEventListener("click", () => {
    let [emoji, count] = spiralBtn.textContent.split(" ");
    count = parseInt(count) + 1;
    spiralBtn.textContent = `${emoji} ${count}`;
  });
</script>

</body>
</html>
