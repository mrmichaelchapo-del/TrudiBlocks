<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrudiBlocks - Project</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
      background: #f5f5ff;
    }
    textarea {
      width: 100%;
      height: 60px;
      font-size: 16px;
      padding: 8px;
    }
    .label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }
    .url-box {
      margin-top: 16px;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: monospace;
    }

    /* FIXED BUTTON STYLES */
    .stats-buttons button {
      margin-right: 8px;
      padding: 6px 12px;
      font-size: 16px;
    }

    .remix-btn {
      background: blue;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .remix-btn img {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <h1 id="pageHeading">TrudiBlocks – Project</h1>

  <label class="label" for="projectNameBox">Project name (type here):</label>
  <textarea id="projectNameBox">Project</textarea>

  <div class="url-box">
    Current project URL:<br>
    <span id="projectUrl">https://trudiblocks.com/projects/project</span>
  </div>

  <script>
    const textarea = document.getElementById("projectNameBox");
    const heading = document.getElementById("pageHeading");
    const urlSpan = document.getElementById("projectUrl");

    const baseUrl = "https://trudiblocks.com/projects/";

    function slugify(name) {
      return name
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function updateProjectStuff() {
      let rawName = textarea.value.trim() || "Project";
      const slug = slugify(rawName) || "project";

      document.title = `TrudiBlocks - ${rawName}`;
      heading.innerText = `TrudiBlocks – ${rawName}`;

      const fullUrl = baseUrl + slug;
      urlSpan.innerText = fullUrl;

      history.replaceState(null, "", "/projects/" + slug);
    }

    updateProjectStuff();
    textarea.addEventListener("input", updateProjectStuff);
  </script>

  <div class="stats-buttons">
    <button>♥️ 0</button>
    <button>⭐ 0</button>
    <button>👁️ 0</button>
    <button>🌀 0<script>
  // Get the spiral button
  const spiralBtn = document.querySelector(".stats-buttons button:nth-child(4)");

  // Disable direct clicking
  spiralBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
  });

  // Get the Remix button
  const remixBtn = document.querySelector("button[style*='background: blue']");

  // When Remix is clicked, increase the spiral count
  remixBtn.addEventListener("click", () => {
    let parts = spiralBtn.textContent.split(" ");
    let emoji = parts[0];
    let count = parseInt(parts[1]);

    count++;

    spiralBtn.textContent = `${emoji} ${count}`;
  });
</script></button>
<script>
  // STAT BUTTON COUNTERS
  const statButtons = document.querySelectorAll(".stats-buttons button");

  statButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      // Extract the number from the button text
      let parts = btn.textContent.split(" ");
      let emoji = parts[0];
      let count = parseInt(parts[1]);

      // Increase count
      count++;

      // Update button text
      btn.textContent = `${emoji} ${count}`;
    });
  });
</script>
  </div>

  <button style="background: blue;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;">
    <img src="remix.png" alt="Remix icon">
    Remix
  </button>

</body>
</html>
