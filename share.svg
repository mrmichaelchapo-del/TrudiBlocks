<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Outlined play triangle -->
  <polygon 
    points="55,40 55,120 120,80" 
    fill="none" 
    stroke="#000" 
    stroke-width="6" 
    stroke-linejoin="round"
  />

  <!-- Corner circles -->
  <circle cx="55" cy="40" r="12" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="55" cy="120" r="12" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="120" cy="80" r="12" fill="#fff" stroke="#000" stroke-width="4"/>

  <!-- Connecting lines -->
  <line x1="55" y1="40" x2="55" y2="120" stroke="#000" stroke-width="4"/>
  <line x1="55" y1="40" x2="120" y2="80" stroke="#000" stroke-width="4"/>
  <line x1="55" y1="120" x2="120" y2="80" stroke="#000" stroke-width="4"/>
</svg>