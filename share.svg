<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Outlined play triangle -->
  <polygon 
    points="50,35 50,105 105,70" 
    fill="none" 
    stroke="#000" 
    stroke-width="6" 
    stroke-linejoin="round"
  />

  <!-- Corner circles (share-style nodes) -->
  <circle cx="50" cy="35" r="10" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="50" cy="105" r="10" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="105" cy="70" r="10" fill="#fff" stroke="#000" stroke-width="4"/>
</svg>